[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxht-probe-numbering"
version = "0.1.0"
description = "Offline single-probe GXHT3W numbering tool"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
gxht-numbering = "warehouse_numbering.app:main"

[tool.setuptools.packages.find]
include = ["warehouse_numbering*", "warehouse_pc*"]

[tool.setuptools.package-data]
warehouse_pc = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
