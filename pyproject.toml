[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-temperature-console"
version = "0.1.1"
description = "Offline serial desktop console for LC-M3 grain temperature devices"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15", "numpy>=1.26,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
warehouse-console = "warehouse_pc.app:main"

[tool.setuptools.packages.find]
include = ["warehouse_pc*"]

[tool.setuptools.package-data]
warehouse_pc = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
