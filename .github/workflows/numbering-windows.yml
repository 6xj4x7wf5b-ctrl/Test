name: Numbering Tool Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'numbering-build/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install pinned build environment
        run: python -m pip install -c requirements-windows-build.txt '.[dev]'
      - name: Test and build numbering tool
        run: python tools/build_numbering.py
      - uses: actions/upload-artifact@v4
        with:
          name: gxht-numbering-windows
          path: |
            dist/GXHTProbeNumbering-*-windows-x64.zip
            dist/GXHTProbeNumbering-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numbering-validation
          path: build/numbering-release/
          retention-days: 14
