name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/**'

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PROGRESS_BAR: "off"
  PIP_NO_INPUT: "1"
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build and verify Windows package
        run: python tools/build_windows.py

      - name: Upload Windows release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            dist/WarehouseTemperatureConsole-*-windows-x64.zip
            dist/WarehouseTemperatureConsole-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-evidence
          path: build/windows-release/
          if-no-files-found: warn
          retention-days: 7
